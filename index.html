<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>CHECKOUT - Horror Hotel</title>

<style>

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: none;
  overscroll-behavior: none;
  position: fixed;
  background: black;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

#menu {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: linear-gradient(to bottom, #000000, #1b0000);
  color: white;
  z-index: 20;
}

h1 {
  font-size: 70px;
  color: crimson;
  text-shadow: 0 0 20px red;
  margin-bottom: 10px;
}

p {
  opacity: 0.8;
  margin-bottom: 30px;
}

button {
  padding: 15px 40px;
  border: none;
  border-radius: 12px;
  font-size: 20px;
  background: crimson;
  color: white;
}

#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  color: white;
  z-index: 10;
  display: none;
  font-size: 20px;
}

#crosshair {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 10px;
  height: 10px;
  background: white;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  display: none;
}

#mobileControls {
  position: absolute;
  bottom: 20px;
  left: 20px;
  z-index: 30;
}

#joystickBase {
  width: 120px;
  height: 120px;
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  position: relative;
}

#joystick {
  width: 50px;
  height: 50px;
  background: crimson;
  border-radius: 50%;
  position: absolute;
  left: 35px;
  top: 35px;
}

</style>
</head>
<body>

<div id="menu">
  <h1>CHECKOUT</h1>
  <p>Kabur dari hotel terkutuk sebelum jam 03:00...</p>
  <button id="startBtn">MULAI</button>
</div>

<div id="hud">
  Room: <span id="room">1</span>
</div>

<div id="crosshair"></div>

<div id="mobileControls">
  <div id="joystickBase">
    <div id="joystick"></div>
  </div>
</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

let scene, camera, renderer;

let moveX = 0;
let moveY = 0;

let roomNumber = 1;
let monster;

const startBtn = document.getElementById('startBtn');
const menu = document.getElementById('menu');
const hud = document.getElementById('hud');
const roomText = document.getElementById('room');
const crosshair = document.getElementById('crosshair');

startBtn.addEventListener('click', () => {

  menu.style.display = 'none';
  hud.style.display = 'block';
  crosshair.style.display = 'block';

  init();
  animate();

});

function init() {

  scene = new THREE.Scene();

  scene.background = new THREE.Color(0x050505);

  scene.fog = new THREE.Fog(0x000000, 10, 80);

  camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  camera.position.set(0, 2, 5);

  renderer = new THREE.WebGLRenderer({
    antialias: true
  });

  renderer.setSize(window.innerWidth, window.innerHeight);

  renderer.shadowMap.enabled = true;

  document.body.appendChild(renderer.domElement);

  const ambient = new THREE.AmbientLight(0x404040, 1);

  scene.add(ambient);

  const light = new THREE.PointLight(0xffaa66, 15, 50);

  light.position.set(0, 5, 0);

  scene.add(light);

  createHotel();
  createMonster();

  setupJoystick();

  window.addEventListener('resize', onResize);

}

function createHotel() {

  const floorGeo = new THREE.BoxGeometry(100, 1, 300);

  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x330000
  });

  const floor = new THREE.Mesh(floorGeo, floorMat);

  scene.add(floor);

  for(let i = 0; i < 20; i++) {

    createRoom(i * -15);

  }

}

function createRoom(z) {

  const wallMat = new THREE.MeshStandardMaterial({
    color: 0x552222
  });

  const wallGeo = new THREE.BoxGeometry(1, 6, 12);

  const leftWall = new THREE.Mesh(wallGeo, wallMat);

  leftWall.position.set(-6, 3, z);

  scene.add(leftWall);

  const rightWall = new THREE.Mesh(wallGeo, wallMat);

  rightWall.position.set(6, 3, z);

  scene.add(rightWall);

  const backGeo = new THREE.BoxGeometry(12, 6, 1);

  const backWall = new THREE.Mesh(backGeo, wallMat);

  backWall.position.set(0, 3, z - 6);

  scene.add(backWall);

  const doorGeo = new THREE.BoxGeometry(3, 5, 0.5);

  const doorMat = new THREE.MeshStandardMaterial({
    color: 0x111111
  });

  const door = new THREE.Mesh(doorGeo, doorMat);

  door.position.set(0, 2.5, z + 6);

  scene.add(door);

  const lamp = new THREE.PointLight(0xffcc88, 8, 15);

  lamp.position.set(0, 5, z);

  scene.add(lamp);

}

function createMonster() {

  const geo = new THREE.BoxGeometry(2, 4, 2);

  const mat = new THREE.MeshStandardMaterial({
    color: 0x111111,
    emissive: 0x440000
  });

  monster = new THREE.Mesh(geo, mat);

  monster.position.set(0, 2, -50);

  scene.add(monster);

}

function updateMonster() {

  monster.position.z += 0.03;

  const distance = monster.position.distanceTo(camera.position);

  if(distance < 3) {

    alert('KAMU TERTANGKAP!');
    location.reload();

  }

}

function setupJoystick() {

  const base = document.getElementById('joystickBase');

  const stick = document.getElementById('joystick');

  base.addEventListener('touchmove', (e) => {

    e.preventDefault();

    const rect = base.getBoundingClientRect();

    const touch = e.touches[0];

    let x = touch.clientX - rect.left - 60;

    let y = touch.clientY - rect.top - 60;

    const distance = Math.sqrt(x*x + y*y);

    const max = 40;

    if(distance > max) {

      x = (x / distance) * max;
      y = (y / distance) * max;

    }

    stick.style.left = (x + 35) + 'px';

    stick.style.top = (y + 35) + 'px';

    moveX = x / max;

    moveY = y / max;

  });

  base.addEventListener('touchend', () => {

    moveX = 0;
    moveY = 0;

    stick.style.left = '35px';

    stick.style.top = '35px';

  });

}

function animate() {

  requestAnimationFrame(animate);

  camera.position.x += moveX * 0.1;

  camera.position.z += moveY * 0.2;

  const currentRoom = Math.floor(Math.abs(camera.position.z) / 15) + 1;

  if(currentRoom !== roomNumber) {

    roomNumber = currentRoom;

    roomText.textContent = roomNumber;

  }

  updateMonster();

  renderer.render(scene, camera);

}

function onResize() {

  camera.aspect = window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);

}

document.body.addEventListener('touchmove', function(e) {
  e.preventDefault();
}, { passive:false });

</script>

</body>
</html>
